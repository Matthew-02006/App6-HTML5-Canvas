<!DOCTYPE html> 
<html> 

<!--
Brief Description of Goal of Code:
This application demonstrates how to use an HTML5 canvas.
Users can draw a rectangle, display text (my name), load an image,
and clear the canvas using interactive buttons.

Known Issues:
None currently.
-->

<head> 
    <title>App6---HTML5-Canvas</title>  
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head> 

<body>

<div id="header">
    <h1>App6---HTML5-Canvas</h1>
</div>

<div id="content">
    <p>This app allows interaction with a canvas using buttons.</p>
</div>

<canvas id="myCanvas" width="400" height="250" style="border:2px solid black;"></canvas>

<br><br>

<!-- Allows to control the canvas -->
<button onclick="drawRectangle()">Draw Rectangle</button>
<button onclick="drawName()">Draw Name</button>
<button onclick="drawImage()">Load Image</button>
<button onclick="clearCanvas()">Clear Canvas</button>

<script>

// Wait until the page fully loads before running JavaScript
window.onload = function() {

    var canvas = document.getElementById("myCanvas");

    var ctx = canvas.getContext("2d");

    // This will run when the "Draw Rectangle" button is clicked
    window.drawRectangle = function() {
        ctx.fillStyle = "green"; // Set color to blue
        ctx.fillRect(50, 50, 150, 80); // Draw rectangle
    };

    window.drawName = function() {
        ctx.font = "24px Arial"; // Set font
        ctx.fillStyle = "purple"; // Set text color
        ctx.fillText("Matthew Kim", 100, 200); // Draw text
    };

    window.drawImage = function() {
        var img = new Image(); // Create image object

        img.src = "https://m.media-amazon.com/images/I/21vSi5nmzML._AC_UF894,1000_QL80_.jpg"; // Image source

        // Draw image after it loads
        img.onload = function() {
            ctx.drawImage(img, 50, 50);
        };
    };

    window.clearCanvas = function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    };

};

</script>

</body>
</html>
